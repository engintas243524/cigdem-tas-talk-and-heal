<!doctype html>
<html lang="tr" data-lang="tr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not Paneli — Talk &amp; Heal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=95">
<style>
  /* Standalone internal tool — deliberately does NOT carry the public site header/footer/nav.
     Reuses only style.css's colour + font variables (Jost). Turkish-only (Çiğdem's own tool). */
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); margin: 0; }
  .panel-wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4) var(--space-3) var(--space-6); }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; margin: 0 0 var(--space-3); }
  .hidden { display: none !important; }
  label { display: block; font-size: 0.85rem; font-weight: 500; margin: 0 0 0.4rem; color: var(--taupe); }
  input[type="text"], input[type="password"], input[type="search"], select, textarea {
    width: 100%; box-sizing: border-box; font-family: var(--font-body); font-size: 1rem;
    color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 0.7rem 0.85rem;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus { outline: 2px solid var(--sage); outline-offset: 1px; }
  .row { display: flex; gap: 0.6rem; align-items: flex-start; }
  .row .grow { flex: 1; }
  .field { margin-bottom: var(--space-3); }
  button { font-family: var(--font-body); cursor: pointer; border: none; border-radius: var(--radius-sm); }
  .icon-btn {
    flex: 0 0 auto; width: 48px; height: 48px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink); font-size: 1.3rem;
  }
  .icon-btn.active, .icon-btn.recording { background: var(--brand); color: #fff; border-color: var(--brand); }
  .mic-lang-toggle { display: flex; flex-direction: column; gap: 0.25rem; }
  .mic-lang-toggle button { font-size: 0.65rem; padding: 0.15rem 0.4rem; background: var(--surface); border: 1px solid var(--border); color: var(--taupe); border-radius: var(--radius-xs); }
  .mic-lang-toggle button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: var(--space-2); }
  .actions button { flex: 1 1 auto; min-width: 150px; padding: 0.8rem 1rem; font-size: 0.95rem; font-weight: 500; }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn-primary { background: var(--btn-cta); color: #fff; }
  .btn-primary:disabled { background: var(--border); color: var(--taupe); cursor: not-allowed; }
  .context-line { font-size: 0.85rem; color: var(--taupe); margin: 0 0 var(--space-2); min-height: 1.2em; }
  .status { font-size: 0.9rem; margin-top: var(--space-2); min-height: 1.2em; }
  .status.err { color: var(--brand-deep); }
  .status.ok { color: var(--sage); }
  /* Client picker */
  .picker { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); margin-top: var(--space-2); }
  .picker-list { max-height: 320px; overflow-y: auto; }
  .client { border-top: 1px solid var(--border); padding: 0.6rem 0.85rem; }
  .client:first-child { border-top: none; }
  .client-name { font-weight: 600; font-size: 0.95rem; }
  .client.cancelled .client-name::after { content: " (iptal)"; color: var(--brand-deep); font-weight: 400; font-size: 0.8rem; }
  .sess { display: inline-block; margin: 0.35rem 0.4rem 0 0; padding: 0.3rem 0.6rem; font-size: 0.8rem;
    border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--paper); }
  .sess.done { opacity: 0.55; }
  .sess.cancel-trigger { display: block; margin-top: 0.5rem; color: #fff; background: var(--brand-deep); border-color: var(--brand-deep); font-weight: 500; }
  .muted { color: var(--taupe); font-size: 0.82rem; }
  .cancel-summary { color: var(--brand-deep); }
  #clientSearchField { margin-bottom: 0.5rem; }
  .cancel-box { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 0.85rem; margin-top: var(--space-2); }
  #cancelSessionsList label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 400; color: var(--ink); margin: 0.3rem 0; }
  #cancelSessionsList input[type="checkbox"] { width: auto; }
  /* Visually distinct from the plain .field boxes around it — a sage-accented frame so it never
     reads as "just another note field" (see the HTML comment above #cancelClientMessage). */
  .cancel-message-box { border: 1px solid var(--sage); border-radius: var(--radius-sm); padding: 0.75rem; background: var(--surface); }
  .cancel-message-box label { color: var(--sage); font-weight: 600; }
  .cancel-message-box textarea { min-height: 90px; }
  .hint { color: var(--taupe); font-size: 0.78rem; margin: 0.35rem 0 0; }
</style>
</head>
<body>
<div class="panel-wrap">

  <!-- LOGIN -->
  <section id="loginView">
    <h1>Not Paneli</h1>
    <div class="field">
      <label for="pw">Panel parolası</label>
      <input type="password" id="pw" autocomplete="current-password" />
    </div>
    <div class="actions">
      <button class="btn-primary" id="loginBtn" type="button">Giriş</button>
    </div>
    <div class="status err" id="loginStatus"></div>
  </section>

  <!-- PANEL -->
  <section id="panelView" class="hidden">
    <h1>Seans Notu</h1>
    <div class="actions">
      <button class="btn-secondary" id="showRakipAnaliziBtn" type="button">Rakip Analizi</button>
    </div>

    <div class="field">
      <label for="nameBox">Danışan (düzenlenebilir — yalnızca görüntü içindir)</label>
      <div class="row">
        <input type="text" id="nameBox" class="grow" />
        <button class="icon-btn" id="pickBtn" type="button" title="Danışan ara" aria-label="Danışan ara">▾</button>
      </div>
    </div>

    <!-- client picker (toggled by pickBtn) -->
    <div class="picker hidden" id="picker">
      <div style="padding:0.6rem">
        <select id="clientSearchField">
          <option value="name">İsim</option>
          <option value="stripeSessionId">Stripe İşlem No</option>
          <option value="email">E-posta</option>
          <option value="phone">Telefon</option>
          <option value="sessionType">Seans Türü</option>
          <option value="therapyMode">Terapi Türü</option>
          <option value="sessionMode">Seans Şekli</option>
          <option value="sessionDurationMinutes">Seans Süresi</option>
          <option value="sessionCount">Toplam Seans Sayısı</option>
          <option value="activeSessionCount">Kalan Seans Sayısı</option>
        </select>
        <input type="search" id="clientSearch" placeholder="İsim ara..." autocomplete="off" />
      </div>
      <div class="picker-list" id="clientList"></div>
    </div>

    <p class="context-line" id="contextLine"></p>

    <!-- Manual override cancellation (extreme circumstances) — triggered from the client picker's "İptal Et" button -->
    <div class="cancel-box hidden" id="cancelBox">
      <p class="context-line" id="cancelContextLine"></p>
      <div class="field">
        <label>İptal edilecek seans(lar) — en az birini seçin</label>
        <div id="cancelSessionsList"></div>
      </div>
      <div class="field">
        <p class="context-line" id="cancelRefundPreview"></p>
      </div>
      <div class="field">
        <label for="cancelReason">İptal nedeni</label>
        <select id="cancelReason">
          <option value="Ağır hastalık">Ağır hastalık</option>
          <option value="Vefat">Vefat</option>
          <option value="Doğum">Doğum</option>
          <option value="Kaza / Hastane yatışı">Kaza / Hastane yatışı</option>
          <option value="Ailevi acil durum">Ailevi acil durum</option>
          <option value="Habersiz gelmedi">Habersiz gelmedi</option>
          <option value="Diğer">Diğer</option>
        </select>
      </div>
      <div class="field hidden" id="cancelDetailField">
        <label for="cancelDetail">Açıklama</label>
        <input type="text" id="cancelDetail" maxlength="450" />
      </div>
      <div class="field">
        <label for="cancelPercent">İade oranı</label>
        <select id="cancelPercent"></select>
      </div>
      <!-- Deliberately its own framed box, separate from the general session-note textarea below —
           Çiğdem could otherwise think filling in the session note also sends this to the client. -->
      <div class="field cancel-message-box">
        <label for="cancelClientMessage">Danışana giden kişisel not (opsiyonel)</label>
        <textarea id="cancelClientMessage" maxlength="450" placeholder="Örn: Geçmiş olsun, kendine iyi bak. Herhangi bir konuda destek gerekirse buradayım."></textarea>
        <p class="hint">Bu metin, WhatsApp mesajı olarak danışana gönderilir ve Google Sheet'e ayrı bir sütun olarak işlenir.</p>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="cancelCloseBtn" type="button">Vazgeç</button>
        <button class="btn-primary" id="cancelConfirmBtn" type="button">Randevuyu İptal Et</button>
      </div>
      <div class="status" id="cancelStatus"></div>
    </div>

    <div class="field">
      <label for="noteBox">Not</label>
      <div class="row">
        <textarea id="noteBox" class="grow" placeholder="Seans notunu buraya yazın ya da mikrofonla dikte edin..."></textarea>
        <div class="mic-lang-toggle" id="micLangToggle">
          <button type="button" data-lang="tr" class="active">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn mic-btn" id="micBtn" type="button" title="Sesli not (Chrome)" aria-label="Sesli not">
          <span class="mic-icon" aria-hidden="true">🎤</span>
          <span class="mic-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
      </div>
      <p class="muted" id="micHint"></p>
    </div>

    <div class="actions">
      <button class="btn-secondary" id="appendBtn" type="button">Eski nota ekle</button>
      <button class="btn-secondary" id="replaceBtn" type="button">Eski not ile değiştir</button>
      <button class="btn-primary" id="addBtn" type="button">Ekle</button>
    </div>
    <div class="status" id="panelStatus"></div>
  </section>

  <!-- RAKİP ANALİZİ -->
  <section id="rakipAnaliziSection" class="hidden">
    <h1>Rakip Analizi</h1>
    <div class="actions">
      <button class="btn-secondary" id="backToNoteBtn" type="button">◂ Not Paneline Dön</button>
    </div>
    <div class="actions">
      <button class="btn-secondary" id="dalIcerikBtn" type="button">Görsel/Video Stratejisi</button>
      <button class="btn-secondary" id="dalAksiyonBtn" type="button">Aksiyon/Hedef Analizi</button>
    </div>

    <div class="field" id="rakipEkleField">
      <h3>Rakip Ekle</h3>
      <input type="text" id="rakipIsim" placeholder="Rakip ismi">
      <input type="text" id="rakipLink" placeholder="Link (opsiyonel)">
      <div class="row">
        <textarea id="rakipNot" class="grow" placeholder="Gözlem/not — yazın ya da mikrofonla dikte edin..."></textarea>
        <div class="mic-lang-toggle" id="rakipMicLangToggle">
          <button type="button" data-lang="tr" class="active">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn mic-btn" id="rakipMicBtn" type="button" title="Sesli not (Chrome)" aria-label="Sesli not">
          <span class="mic-icon" aria-hidden="true">🎤</span>
          <span class="mic-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
      </div>
      <p class="muted" id="rakipMicHint"></p>
      <button class="btn-primary" id="rakipEkleBtn" type="button">Rakip Ekle</button>
      <div class="status" id="rakipEkleStatus"></div>
    </div>

    <div class="field">
      <h3>Konum ile Rakip Ara</h3>
      <input type="number" id="rakipLat" placeholder="Enlem (lat)" step="any">
      <input type="number" id="rakipLng" placeholder="Boylam (lng)" step="any">
      <input type="number" id="rakipRadius" placeholder="Yarıçap (metre)" value="2000">
      <button class="btn-secondary" id="rakipAraBtn" type="button">Ara</button>
      <div id="rakipHarita" style="height:320px;width:100%;margin-top:0.5rem;"></div>
      <ul id="rakipSonuclar"></ul>
    </div>

    <div class="field" id="dalIstekField">
      <h3 id="dalBaslik">İstek</h3>
      <div class="row">
        <textarea id="dalIstek" class="grow" placeholder="İsteğinizi yazın ya da mikrofonla dikte edin..."></textarea>
        <div class="mic-lang-toggle" id="dalMicLangToggle">
          <button type="button" data-lang="tr" class="active">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn mic-btn" id="dalMicBtn" type="button" title="Sesli istek (Chrome)" aria-label="Sesli istek">
          <span class="mic-icon" aria-hidden="true">🎤</span>
          <span class="mic-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
      </div>
      <p class="muted" id="dalMicHint"></p>
      <button class="btn-primary" id="dalGonderBtn" type="button">Rapor Üret</button>
      <div class="status" id="dalStatus"></div>
      <div id="dalRapor" class="muted" style="white-space:pre-wrap;"></div>
    </div>
  </section>

</div>

<script>
(function () {
  // Local dev (python3 -m http.server + wrangler dev) uses localhost:8787; every other origin
  // (GitHub Pages, custom domain) hits the deployed Worker.
  var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
    ? 'http://localhost:8787'
    : 'https://form-backend.engintass19-358.workers.dev';

  var token = sessionStorage.getItem('panelToken') || '';
  var current = null; // { stripeSessionId, sessionIndex, name, note, submitted, isLastSession, appointmentStartUtc, clientTimeZone }

  var el = function (id) { return document.getElementById(id); };
  var loginView = el('loginView'), panelView = el('panelView');
  var nameBox = el('nameBox'), noteBox = el('noteBox');
  var addBtn = el('addBtn'), appendBtn = el('appendBtn'), replaceBtn = el('replaceBtn');
  var contextLine = el('contextLine'), panelStatus = el('panelStatus');

  function showPanel() { loginView.classList.add('hidden'); panelView.classList.remove('hidden'); }
  function showLogin() { panelView.classList.add('hidden'); loginView.classList.remove('hidden'); }

  function setStatus(elm, msg, kind) {
    elm.textContent = msg || '';
    elm.className = 'status' + (kind ? ' ' + kind : '');
  }

  function fmt(iso, tz) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString('tr-TR', { timeZone: tz || 'Europe/London', dateStyle: 'medium', timeStyle: 'short' }); }
    catch (e) { return iso; }
  }

  // Authenticated fetch — attaches the Bearer token; a 401 kicks back to the login view.
  function authFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
    return fetch(API_BASE + path, opts).then(function (r) {
      if (r.status === 401) { token = ''; sessionStorage.removeItem('panelToken'); showLogin(); throw new Error('unauthorized'); }
      return r;
    });
  }

  // --- Login ---
  el('loginBtn').addEventListener('click', function () {
    var pw = el('pw').value;
    setStatus(el('loginStatus'), '', '');
    fetch(API_BASE + '/panel/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw })
    }).then(function (r) {
      if (!r.ok) throw new Error('bad');
      return r.json();
    }).then(function (data) {
      token = data.token; sessionStorage.setItem('panelToken', token);
      // Long-lived, same-origin flag every public page checks to (only) decide whether to show
      // the "NOTES" nav link — cosmetic, never itself a credential; the panel still requires this
      // same password on every visit regardless of this flag's presence.
      localStorage.setItem('panelAccess', '1');
      el('pw').value = ''; showPanel(); loadPending();
    }).catch(function () { setStatus(el('loginStatus'), 'Parola hatalı.', 'err'); });
  });
  el('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('loginBtn').click(); });

  // --- Load a session context into the note box ---
  function applyContext(ctx) {
    current = ctx;
    nameBox.value = ctx.name || '';
    noteBox.value = ctx.note || '';
    var parts = [];
    parts.push((ctx.sessionIndex || 1) + '. seans');
    if (ctx.appointmentStartUtc) parts.push(fmt(ctx.appointmentStartUtc, ctx.clientTimeZone));
    parts.push(ctx.isLastSession ? 'son seans' : 'sonraki randevu var');
    contextLine.textContent = parts.join(' · ');
    // "Ekle" locks once used for this session (guard set); corrections go through append/replace.
    addBtn.disabled = !!ctx.submitted;
    addBtn.textContent = ctx.submitted ? 'Ekle (işlendi)' : 'Ekle';
    setStatus(panelStatus, '', '');
  }

  function clearContext() {
    current = null; contextLine.textContent = ''; addBtn.disabled = true;
  }

  function loadPending() {
    clearContext();
    setStatus(panelStatus, 'Yükleniyor...', '');
    authFetch('/panel/pending').then(function (r) { return r.json(); }).then(function (data) {
      if (data.pending) { applyContext(data.pending); }
      else { setStatus(panelStatus, 'Kapatılmayı bekleyen seans yok. Danışan aramak için ok tuşunu kullanın.', ''); addBtn.disabled = true; }
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(panelStatus, 'Yüklenemedi.', 'err'); });
  }

  // --- Client picker ---
  var picker = el('picker'), clientList = el('clientList'), clientSearch = el('clientSearch');
  var clientSearchField = el('clientSearchField');
  var allClients = [];

  // Turkish labels for the search-by dropdown and for the raw enum codes Sheets stores — the
  // dropdown itself IS the "ok tuşu ile açılan liste" (a native <select>, no custom widget needed).
  var FIELD_LABELS = {
    name: 'İsim', stripeSessionId: 'Stripe İşlem No', email: 'E-posta', phone: 'Telefon',
    sessionType: 'Seans Türü', therapyMode: 'Terapi Türü', sessionMode: 'Seans Şekli',
    sessionDurationMinutes: 'Seans Süresi', sessionCount: 'Toplam Seans Sayısı', activeSessionCount: 'Kalan Seans Sayısı',
  };
  var VALUE_LABELS = {
    sessionType: { standard: 'Standart', extended: 'Uzatılmış' },
    therapyMode: { individual: 'Bireysel', couple: 'Çift' },
    sessionMode: { online: 'Online', inPerson: 'Yüz Yüze' },
  };
  function fieldText(c, field) {
    var raw = c[field] == null ? '' : String(c[field]);
    var map = VALUE_LABELS[field];
    return (map && map[raw]) || raw;
  }

  el('pickBtn').addEventListener('click', function () {
    if (!picker.classList.contains('hidden')) { picker.classList.add('hidden'); return; }
    cancelBox.classList.add('hidden'); cancelTarget = null; // reopening the picker leaves any open cancel panel behind
    picker.classList.remove('hidden');
    authFetch('/panel/clients').then(function (r) { return r.json(); }).then(function (data) {
      allClients = data.clients || []; renderClients(clientSearch.value);
    }).catch(function (e) { if (e.message !== 'unauthorized') clientList.innerHTML = '<div class="client muted">Liste yüklenemedi.</div>'; });
  });

  clientSearch.addEventListener('input', function () { renderClients(clientSearch.value); });
  clientSearchField.addEventListener('change', function () {
    clientSearch.placeholder = FIELD_LABELS[clientSearchField.value] + ' ara...';
    renderClients(clientSearch.value);
  });

  // Total minus still-active is what a PARTIAL cancellation leaves behind — a full cancellation
  // (cancelledAt set) always shows its own line regardless of the count math.
  function cancelSummary(c) {
    var total = Number(c.sessionCount) || 0;
    var active = Number(c.activeSessionCount);
    if (isNaN(active)) active = total;
    var cancelledCount = total - active;
    if (!c.cancelled && cancelledCount <= 0) return '';
    var line = c.cancelled ? 'Randevu tamamen iptal edildi' : (cancelledCount + ' seans iptal edildi');
    var extra = [];
    if (c.refundAmount) extra.push('£' + c.refundAmount + ' iade');
    if (c.cancellationReason) extra.push(c.cancellationReason);
    if (extra.length) line += ' — ' + extra.join(', ');
    return line;
  }

  // Diacritic-insensitive: international clients' names (Lucía, María, Chloé, Müller...) must be
  // findable by their unaccented spelling too, since that's what a therapist typing fast will use.
  // NFD + strip combining marks after the 'tr' lowercase (so İ's combining dot also strips).
  function normalizeSearch(s) {
    return (s || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function renderClients(q) {
    q = normalizeSearch(q);
    var field = clientSearchField.value;
    clientList.innerHTML = '';
    var matches = allClients.filter(function (c) { return normalizeSearch(fieldText(c, field)).indexOf(q) !== -1; });
    if (!matches.length) { clientList.innerHTML = '<div class="client muted">Eşleşen danışan yok.</div>'; return; }
    matches.forEach(function (c) {
      var div = document.createElement('div');
      div.className = 'client' + (c.cancelled ? ' cancelled' : '');
      var nameEl = document.createElement('div'); nameEl.className = 'client-name'; nameEl.textContent = c.name;
      div.appendChild(nameEl);
      if (field !== 'name') {
        var matchLine = document.createElement('div'); matchLine.className = 'muted';
        matchLine.textContent = FIELD_LABELS[field] + ': ' + fieldText(c, field);
        div.appendChild(matchLine);
      }
      var summary = cancelSummary(c);
      if (summary) {
        var summaryEl = document.createElement('div'); summaryEl.className = 'muted cancel-summary'; summaryEl.textContent = summary;
        div.appendChild(summaryEl);
      }
      (c.sessions || []).forEach(function (s) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sess' + (s.submitted ? ' done' : '');
        b.textContent = s.sessionIndex + '. seans' + (s.startUtc ? ' — ' + fmt(s.startUtc) : '') + (s.submitted ? ' ✓' : '');
        b.addEventListener('click', function () { openSession(c.stripeSessionId, s.sessionIndex); });
        div.appendChild(b);
      });
      // Only offer "İptal Et" when at least one session is still in the future — a booking whose
      // every session is already past has nothing computeOverrideRefund (lib/refund.ts) would ever
      // treat as cancellable, so showing the button would just lead to a confusing empty picker.
      var hasFutureSession = (c.sessions || []).some(function (s) { return s.startUtc && new Date(s.startUtc).getTime() > Date.now(); });
      if (!c.cancelled && hasFutureSession) {
        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'sess cancel-trigger';
        cancelBtn.textContent = 'İptal Et';
        cancelBtn.addEventListener('click', function () { openCancel(c.stripeSessionId, c.name, c.sessions); });
        div.appendChild(cancelBtn);
      }
      clientList.appendChild(div);
    });
  }

  // --- Manual override cancellation (extreme circumstances) ---
  var cancelBox = el('cancelBox'), cancelContextLine = el('cancelContextLine'), cancelSessionsList = el('cancelSessionsList');
  var cancelReason = el('cancelReason'), cancelDetailField = el('cancelDetailField'), cancelDetail = el('cancelDetail');
  var cancelPercent = el('cancelPercent'), cancelStatus = el('cancelStatus'), cancelRefundPreview = el('cancelRefundPreview');
  var cancelClientMessage = el('cancelClientMessage');
  var cancelTarget = null; // { stripeSessionId, name }

  for (var pct = 100; pct >= 0; pct -= 5) {
    var pctOpt = document.createElement('option');
    pctOpt.value = String(pct); pctOpt.textContent = '%' + pct;
    cancelPercent.appendChild(pctOpt);
  }

  cancelReason.addEventListener('change', function () {
    cancelDetailField.classList.toggle('hidden', cancelReason.value !== 'Diğer');
  });

  function checkedCancelIndexes() {
    return Array.prototype.slice.call(cancelSessionsList.querySelectorAll('input:checked')).map(function (cb) { return Number(cb.value); });
  }

  // Info box next to the picker: 'auto' (checkbox toggled) shows what the automatic 72h policy
  // would refund; 'manual' (İade Oranı dropdown touched) shows what Çiğdem's own hand-picked rate
  // would refund instead — same box, whichever control she touched last wins.
  var refundPreviewSeq = 0;
  function updateRefundPreview(mode) {
    var indexes = checkedCancelIndexes();
    if (!indexes.length) { cancelRefundPreview.textContent = ''; return; }
    var thisSeq = ++refundPreviewSeq;
    var qs = '?stripeSessionId=' + encodeURIComponent(cancelTarget.stripeSessionId) + '&sessions=' + indexes.join(',');
    if (mode === 'manual') qs += '&percent=' + encodeURIComponent(cancelPercent.value);
    authFetch('/panel/refund-preview' + qs).then(function (r) { return r.json(); }).then(function (data) {
      if (thisSeq !== refundPreviewSeq) return; // a newer request already landed, ignore this stale one
      cancelRefundPreview.textContent = (mode === 'manual' ? 'Seçilen orana göre iade: ' : 'Otomatik hesaplanan iade: ') +
        '£' + data.refundGBP + ' (%' + data.refundPercent + ')';
      // Bug (found live 2026-08-10, BE-52): cancelPercent.value stayed hardcoded at the openCancel
      // default ('100') until Çiğdem manually touched the dropdown herself — the confirm() prompt
      // and the refundPercent actually POSTed to /panel/cancel both read cancelPercent.value, so a
      // same-day (<72h, 0% policy) cancellation still confirmed and submitted as "%100 iade" unless
      // she happened to notice and fix the dropdown by hand first. Sync the dropdown itself to the
      // freshly computed automatic value on every checkbox toggle — she can still override it
      // afterward for a genuine extreme-circumstance case, but it now starts correct.
      if (mode === 'auto') cancelPercent.value = String(data.refundPercent);
    }).catch(function (e) { if (e.message !== 'unauthorized') cancelRefundPreview.textContent = 'İade hesaplanamadı.'; });
  }
  cancelPercent.addEventListener('change', function () { updateRefundPreview('manual'); });

  // `sessions` is that client's currently-active (not yet cancelled) sessions from /panel/clients.
  // Nothing is pre-checked — Çiğdem must explicitly pick which one(s) to cancel; a booking with
  // several upcoming sessions must never look like "confirm = cancel everything".
  function openCancel(stripeSessionId, name, sessions) {
    cancelTarget = { stripeSessionId: stripeSessionId, name: name };
    cancelContextLine.textContent = name + ' — iptal edilecek seansı/seansları seçin';
    cancelSessionsList.innerHTML = '';
    var now = Date.now();
    (sessions || []).forEach(function (s) {
      // Backend (lib/refund.ts's remainingSessions) only ever refunds FUTURE sessions — a past
      // one checked here would 400 with no visible reason otherwise. Show it, but not as
      // selectable, so it can't silently fail a cancel attempt.
      var isPast = s.startUtc && new Date(s.startUtc).getTime() <= now;
      var label = document.createElement('label');
      if (isPast) {
        label.className = 'muted';
        label.textContent = s.sessionIndex + '. seans — ' + fmt(s.startUtc) + ' (geçmiş tarihli, iptal edilemez)';
      } else {
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = String(s.sessionIndex);
        cb.addEventListener('change', function () { updateRefundPreview('auto'); });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(s.sessionIndex + '. seans' + (s.startUtc ? ' — ' + fmt(s.startUtc) : '')));
      }
      cancelSessionsList.appendChild(label);
    });
    cancelReason.value = 'Ağır hastalık';
    cancelDetailField.classList.add('hidden');
    cancelDetail.value = '';
    cancelPercent.value = '100';
    cancelClientMessage.value = '';
    cancelRefundPreview.textContent = '';
    setStatus(cancelStatus, '', '');
    picker.classList.add('hidden');
    cancelBox.classList.remove('hidden');
  }

  el('cancelCloseBtn').addEventListener('click', function () {
    cancelBox.classList.add('hidden');
    cancelTarget = null;
  });

  el('cancelConfirmBtn').addEventListener('click', function () {
    if (!cancelTarget) return;
    var indexes = checkedCancelIndexes();
    if (!indexes.length) { setStatus(cancelStatus, 'En az bir seans seçmelisiniz.', 'err'); return; }
    var reason = cancelReason.value;
    var detail = cancelDetail.value.trim();
    if (reason === 'Diğer' && !detail) { setStatus(cancelStatus, "'Diğer' seçildiğinde açıklama girmelisiniz.", 'err'); return; }
    var percent = Number(cancelPercent.value);
    var which = indexes.length === 1 ? (indexes[0] + '. seansı') : (indexes.length + ' seansı (' + indexes.join(', ') + ')');
    if (!confirm(cancelTarget.name + ' için ' + which + ' iptal edilecek ve %' + percent + ' iade yapılacak. Devam edilsin mi?')) return;
    var apptWord = indexes.length === 1 ? 'Randevunuz' : 'Randevularınız';
    setStatus(cancelStatus, apptWord + ' iptal ediliyor...', '');
    authFetch('/panel/cancel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stripeSessionId: cancelTarget.stripeSessionId, sessionIndexes: indexes, refundPercent: percent, reason: reason, reasonDetail: detail, clientMessage: cancelClientMessage.value.trim() })
    }).then(function (r) {
      if (r.status === 409) { setStatus(cancelStatus, 'Bu randevu zaten iptal edilmiş.', 'err'); cancelTarget = null; return; }
      if (!r.ok) return r.json().then(function (data) { throw new Error(data.error || 'İptal edilemedi.'); }, function () { throw new Error('İptal edilemedi.'); });
      return r.json().then(function (data) {
        // Clear the target so a stray extra click on this (now stale) confirm button can never
        // silently re-fire against the just-cancelled booking — found live: a leftover open box
        // from a prior cancellation kept re-submitting to the old target instead of the new one.
        cancelTarget = null;
        setStatus(cancelStatus, apptWord + ' iptal edildi. İade: £' + data.refundGBP + ' (%' + data.refundPercent + ').', 'ok');
      });
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(cancelStatus, e.message, 'err'); });
  });

  function openSession(stripeSessionId, sessionIndex) {
    cancelBox.classList.add('hidden'); cancelTarget = null; // only one action panel visible at a time
    setStatus(panelStatus, 'Yükleniyor...', '');
    authFetch('/panel/note?stripeSessionId=' + encodeURIComponent(stripeSessionId) + '&sessionIndex=' + sessionIndex)
      .then(function (r) { return r.json(); })
      .then(function (data) { applyContext(data.context); picker.classList.add('hidden'); })
      .catch(function (e) { if (e.message !== 'unauthorized') setStatus(panelStatus, 'Not yüklenemedi.', 'err'); });
  }

  // --- Save (3 buttons) ---
  function postNote(mode) {
    if (!current) { setStatus(panelStatus, 'Önce bir danışan/seans seçin.', 'err'); return; }
    return authFetch('/panel/note', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stripeSessionId: current.stripeSessionId, sessionIndex: current.sessionIndex, mode: mode, text: noteBox.value })
    });
  }

  appendBtn.addEventListener('click', function () {
    if (!current) { setStatus(panelStatus, 'Önce bir danışan/seans seçin.', 'err'); return; }
    if (!confirm("Bu not Google Sheet'e gönderilecek. Devam etmek istiyor musunuz?")) return;
    doSimple('append');
  });
  replaceBtn.addEventListener('click', function () {
    if (!current) { setStatus(panelStatus, 'Önce bir danışan/seans seçin.', 'err'); return; }
    if (!confirm("Bu not Google Sheet'e gönderilecek. Devam etmek istiyor musunuz?")) return;
    doSimple('replace');
  });
  addBtn.addEventListener('click', function () {
    if (!current) { setStatus(panelStatus, 'Önce bir danışan/seans seçin.', 'err'); return; }
    var msg = current.isLastSession
      ? "Bu not Google Sheet'e gönderilecek. Devam etmek istiyor musunuz?"
      : "Bu not Google Sheet'e gönderilecek ve danışan bir sonraki randevu için bilgilendirilecek. Devam etmek istiyor musunuz?";
    if (!confirm(msg)) return;
    postNote('add').then(function (r) {
      if (r.status === 409) { setStatus(panelStatus, 'Bu seans için not zaten işlendi. Düzeltme için "Eski nota ekle" / "Eski not ile değiştir" kullanın.', 'err'); addBtn.disabled = true; return; }
      if (!r.ok) throw new Error('fail');
      return r.json().then(function (data) {
        current.submitted = true; addBtn.disabled = true; addBtn.textContent = 'Ekle (işlendi)';
        setStatus(panelStatus, data.notified ? 'Kaydedildi. Danışana sonraki randevu bildirimi gönderildi.' : 'Kaydedildi.', 'ok');
      });
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(panelStatus, 'Kaydedilemedi.', 'err'); });
  });

  function doSimple(mode) {
    var req = postNote(mode);
    if (!req) return;
    req.then(function (r) {
      if (!r.ok) throw new Error('fail');
      setStatus(panelStatus, 'Kaydedildi.', 'ok');
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(panelStatus, 'Kaydedilemedi.', 'err'); });
  }

  // --- Voice input (native Web Speech API — Chrome) — reusable across any textarea+mic pair ---
  // recog.lang used to be hardcoded to 'tr-TR', so any English dictation was forced through
  // Chrome's Turkish speech model and came out as phonetically-similar Turkish words. The
  // TR/EN toggle below picks the model per recording; the same equal-quality dictation as
  // booking.html's mic button, just driven by a manual toggle instead of the site's flag switcher
  // (this panel has no EN/TR page language of its own).
  function attachVoiceInput(config) {
    var textareaEl = config.textareaEl, micBtnEl = config.micBtnEl, micHintEl = config.micHintEl;
    var micLangToggleEl = config.micLangToggleEl, localStorageKey = config.localStorageKey;

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var micLang = localStorage.getItem(localStorageKey) || 'tr';
    if (micLangToggleEl) {
      var setMicLang = function (lang) {
        micLang = lang;
        localStorage.setItem(localStorageKey, lang);
        Array.prototype.forEach.call(micLangToggleEl.querySelectorAll('button'), function (b) {
          b.classList.toggle('active', b.getAttribute('data-lang') === lang);
        });
      };
      micLangToggleEl.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-lang]');
        if (btn) setMicLang(btn.getAttribute('data-lang'));
      });
      setMicLang(micLang);
    }
    if (!SR) {
      micBtnEl.classList.add('hidden');
      micHintEl.textContent = 'Sesli giriş için Google Chrome kullanın.';
      return;
    }

    var LISTENING_TEXT = 'Dinleniyor... konuşun (durdurmak için mikrofona tekrar dokunun).';
    var TOO_QUIET_TEXT = 'Sesini net duyamıyoruz — lütfen biraz daha yüksek sesle konuş.';

    // Live "speak louder" warning: SpeechRecognition exposes no volume/confidence signal, so
    // a second getUserMedia stream feeds an AnalyserNode purely to watch input level while
    // recognition runs. autoGainControl/noiseSuppression/echoCancellation are explicitly OFF
    // on this stream — the browser's default AGC quietly boosts low input back up before it
    // reaches the AnalyserNode, which is why the warning never fired on genuinely quiet
    // speech: the volume was being auto-corrected out from under us.
    // ponytail: fixed RMS threshold, not per-device calibrated — mic gain still varies by
    // hardware even with AGC off; revisit with a noise-floor sample if it misfires.
    var QUIET_RMS = 0.02, QUIET_HOLD_MS = 1200;
    function startVolumeMonitor(onLow, onOk) {
      return navigator.mediaDevices.getUserMedia({
        audio: { autoGainControl: false, noiseSuppression: false, echoCancellation: false }
      }).then(function (stream) {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var source = ctx.createMediaStreamSource(stream);
        var analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        var data = new Uint8Array(analyser.fftSize);
        var quietSince = null, raf;
        (function tick() {
          analyser.getByteTimeDomainData(data);
          var sum = 0;
          for (var i = 0; i < data.length; i++) { var v = (data[i] - 128) / 128; sum += v * v; }
          var rms = Math.sqrt(sum / data.length);
          if (rms < QUIET_RMS) {
            if (quietSince == null) quietSince = Date.now();
            else if (Date.now() - quietSince > QUIET_HOLD_MS) onLow();
          } else {
            quietSince = null;
            onOk();
          }
          raf = requestAnimationFrame(tick);
        })();
        return { stop: function () {
          cancelAnimationFrame(raf);
          stream.getTracks().forEach(function (t) { t.stop(); });
          ctx.close();
        }};
      });
    }

    // continuous:true was the root cause of the worse bugs (note text randomly overwritten,
    // a stray fragment from the other language bleeding into a freshly-started recording):
    // Chrome keeps one long-lived internal multi-utterance buffer under continuous mode
    // that's known to silently drop low-confidence stretches and occasionally deliver a late
    // event after the session has moved on. Instead, each utterance gets its own brand-new
    // SpeechRecognition instance (continuous:false) chained by restarting on every onend —
    // looks the same to Çiğdem (near-instant restart), but there's no shared internal buffer
    // left to get corrupted, and no stale object whose delayed event could land in the wrong
    // session (e.g. after switching the TR/EN toggle).
    var recognizing = false, stoppedByUser = false;
    var volMonitor = null, isQuiet = false;
    var activeRecog = null;  // instance the "stop" click should act on
    var currentSession = 0;  // bumped on every (re)start; a stray late event checks this and bails

    function onVolLow() { if (!isQuiet) { isQuiet = true; micHintEl.textContent = TOO_QUIET_TEXT; } }
    function onVolOk() { if (isQuiet) { isQuiet = false; micHintEl.textContent = LISTENING_TEXT; } }

    function beginSession(before, after, lang) {
      currentSession++;
      var mySession = currentSession;
      var committed = '';
      var r = new SR();
      r.lang = lang;
      r.interimResults = true;
      r.continuous = false;
      activeRecog = r;

      r.onstart = function () {
        if (mySession !== currentSession) return;
        recognizing = true;
        micBtnEl.classList.add('recording');
        micHintEl.textContent = LISTENING_TEXT;
      };
      r.onresult = function (e) {
        if (mySession !== currentSession) return;
        var interim = '';
        for (var i = e.resultIndex; i < e.results.length; i++) {
          var t = e.results[i][0].transcript;
          if (e.results[i].isFinal) committed += t; else interim += t;
        }
        textareaEl.value = before + committed + interim + after;
      };
      r.onerror = function (e) {
        if (mySession !== currentSession) return;
        var fatal = { 'not-allowed': 1, 'audio-capture': 1, 'service-not-allowed': 1 };
        if (fatal[e.error]) { stoppedByUser = true; micHintEl.textContent = 'Mikrofon hatası. İzin verildiğinden emin olun.'; }
      };
      r.onend = function () {
        if (mySession !== currentSession) return;
        recognizing = false;
        micBtnEl.classList.remove('recording');
        if (stoppedByUser) {
          micHintEl.textContent = '';
          if (volMonitor) { volMonitor.stop(); volMonitor = null; }
          isQuiet = false;
          return;
        }
        // Fold whatever's already in the box back in as the next utterance's prefix — always
        // the true current text, never a possibly-stale local variable.
        beginSession(textareaEl.value, '', lang);
      };

      try { r.start(); } catch (e) { /* fresh instance — should never already be started */ }
    }

    micBtnEl.addEventListener('click', function () {
      if (recognizing) { stoppedByUser = true; if (activeRecog) activeRecog.stop(); return; }
      stoppedByUser = false;
      var pos = textareaEl.selectionStart != null ? textareaEl.selectionStart : textareaEl.value.length;
      beginSession(textareaEl.value.slice(0, pos), textareaEl.value.slice(pos), micLang === 'en' ? 'en-GB' : 'tr-TR');
      if (!volMonitor) { startVolumeMonitor(onVolLow, onVolOk).then(function (m) { volMonitor = m; }).catch(function () {}); }
    });
  }

  attachVoiceInput({
    textareaEl: noteBox,
    micBtnEl: el('micBtn'),
    micHintEl: el('micHint'),
    micLangToggleEl: el('micLangToggle'),
    localStorageKey: 'panelMicLang',
  });

  // --- Rakip Analizi ---
  var rakipAnaliziSection = el('rakipAnaliziSection');
  el('showRakipAnaliziBtn').addEventListener('click', function () {
    panelView.classList.add('hidden');
    rakipAnaliziSection.classList.remove('hidden');
  });
  el('backToNoteBtn').addEventListener('click', function () {
    rakipAnaliziSection.classList.add('hidden');
    panelView.classList.remove('hidden');
  });

  attachVoiceInput({
    textareaEl: el('rakipNot'),
    micBtnEl: el('rakipMicBtn'),
    micHintEl: el('rakipMicHint'),
    micLangToggleEl: el('rakipMicLangToggle'),
    localStorageKey: 'panelMicLang',
  });
  attachVoiceInput({
    textareaEl: el('dalIstek'),
    micBtnEl: el('dalMicBtn'),
    micHintEl: el('dalMicHint'),
    micLangToggleEl: el('dalMicLangToggle'),
    localStorageKey: 'panelMicLang',
  });

  el('rakipEkleBtn').addEventListener('click', function () {
    var isim = el('rakipIsim').value.trim();
    if (!isim) { setStatus(el('rakipEkleStatus'), 'Rakip ismi gerekli.', 'err'); return; }
    setStatus(el('rakipEkleStatus'), 'Kaydediliyor...', '');
    authFetch('/panel/rakip-analizi/rakip', {
      method: 'POST',
      body: JSON.stringify({ isim: isim, link: el('rakipLink').value.trim(), not: el('rakipNot').value, kaynak: 'manuel' }),
    }).then(function (r) { return r.json(); }).then(function () {
      setStatus(el('rakipEkleStatus'), 'Eklendi.', 'ok');
      el('rakipIsim').value = ''; el('rakipLink').value = ''; el('rakipNot').value = '';
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(el('rakipEkleStatus'), 'Eklenemedi.', 'err'); });
  });

  el('rakipAraBtn').addEventListener('click', function () {
    var lat = el('rakipLat').value, lng = el('rakipLng').value, radius = el('rakipRadius').value;
    if (!lat || !lng || !radius) { return; }
    var qs = '?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng) + '&radiusMeters=' + encodeURIComponent(radius);
    authFetch('/panel/rakip-analizi/rakip-ara' + qs).then(function (r) { return r.json(); }).then(function (data) {
      var list = el('rakipSonuclar');
      list.innerHTML = '';
      (data.places || []).forEach(function (p) {
        var li = document.createElement('li');
        li.textContent = p.name + ' — ' + p.address;
        var addBtn = document.createElement('button');
        addBtn.type = 'button'; addBtn.className = 'btn-secondary'; addBtn.textContent = 'Ekle';
        addBtn.addEventListener('click', function () {
          authFetch('/panel/rakip-analizi/rakip', {
            method: 'POST',
            body: JSON.stringify({ isim: p.name, adres: p.address, kaynak: 'harita' }),
          }).then(function () { addBtn.disabled = true; addBtn.textContent = 'Eklendi'; });
        });
        li.appendChild(addBtn);
        list.appendChild(li);
      });
      // Not: Google Maps JS API'nin harita render kısmı (google.maps.Map + Marker) ayrı bir
      // <script src="https://maps.googleapis.com/maps/api/js?key=..."> yüklemesi gerektiriyor —
      // bu adımın kapsamı dışında, ayrı bir küçük takip görevi olarak bırakıldı (liste görünümü
      // haritasız da tam işlevsel).
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(el('rakipEkleStatus'), 'Harita şu an yüklenemedi, manuel giriş yapabilirsin.', 'err'); });
  });

  var currentDal = 'icerikStrateji';
  function setDal(dal) {
    currentDal = dal;
    el('dalBaslik').textContent = dal === 'icerikStrateji' ? 'Görsel/Video Stratejisi İsteği' : 'Aksiyon/Hedef Analizi İsteği';
  }
  el('dalIcerikBtn').addEventListener('click', function () { setDal('icerikStrateji'); });
  el('dalAksiyonBtn').addEventListener('click', function () { setDal('aksiyonAnaliz'); });
  setDal('icerikStrateji');

  el('dalGonderBtn').addEventListener('click', function () {
    var istek = el('dalIstek').value.trim();
    if (!istek) { setStatus(el('dalStatus'), 'İstek metni gerekli.', 'err'); return; }
    setStatus(el('dalStatus'), 'Rapor üretiliyor...', '');
    var path = currentDal === 'icerikStrateji' ? '/panel/rakip-analizi/icerik-strateji' : '/panel/rakip-analizi/aksiyon-analiz';
    var payload = currentDal === 'icerikStrateji' ? { istek: istek } : { yorum: istek };
    authFetch(path, { method: 'POST', body: JSON.stringify(payload) }).then(function (r) { return r.json(); }).then(function (data) {
      setStatus(el('dalStatus'), '', '');
      el('dalRapor').textContent = data.rapor;
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(el('dalStatus'), 'Rapor şu an üretilemedi, lütfen tekrar dene.', 'err'); });
  });

  // Resume an existing session-token on reload.
  if (token) { showPanel(); loadPending(); } else { showLogin(); }
})();
</script>
</body>
</html>
