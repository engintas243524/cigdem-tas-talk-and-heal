<!doctype html>
<html lang="tr" data-lang="tr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rakip Analizi — Talk &amp; Heal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=95">
<link rel="stylesheet" href="panel.css?v=1">
</head>
<body>
<div class="panel-wrap">

  <!-- Standalone internal tool, own login screen — independent of panel.html (not nested inside
       it, not reached through it). Uses the SAME panel password/backend (one password to
       remember), but its own page/session entry point — reachable directly via a bookmark or the
       hidden "RAKİP ANALİZİ" header link (index.html etc.), same convention as panel.html's own
       hidden "NOT PANELİ" link. Not linked from any public nav a random visitor would see. -->

  <!-- LOGIN -->
  <section id="raLoginView">
    <h1>Rakip Analizi</h1>
    <div class="field">
      <label for="raPw">Panel parolası</label>
      <input type="password" id="raPw" autocomplete="current-password" />
    </div>
    <div class="actions">
      <button class="btn-primary" id="raLoginBtn" type="button">Giriş</button>
    </div>
    <div class="status err" id="raLoginStatus"></div>
  </section>

  <!-- APP -->
  <section id="rakipAnaliziSection" class="hidden">
    <h1>Rakip Analizi</h1>
    <div class="actions">
      <a class="btn-secondary" href="panel.html" id="backToNoteLink">◂ Not Paneline Git</a>
    </div>

    <div class="field" id="kullanimSayaciField">
      <h3>Bu Ayki Kullanım</h3>
      <div id="kullanimSayaci" class="kota-grid"></div>
    </div>

    <div class="actions">
      <button class="btn-secondary" id="dalIcerikBtn" type="button">Görsel/Video Stratejisi</button>
      <button class="btn-secondary" id="dalAksiyonBtn" type="button">Aksiyon/Hedef Analizi</button>
    </div>

    <div class="field" id="rakipEkleField">
      <h3>Rakip Ekle</h3>
      <input type="text" id="rakipIsim" placeholder="Rakip ismi">
      <input type="text" id="rakipLink" placeholder="Link (opsiyonel)">
      <div class="row">
        <textarea id="rakipNot" class="grow" placeholder="Gözlem/not — yazın ya da mikrofonla dikte edin..."></textarea>
        <div class="mic-lang-toggle" id="rakipMicLangToggle">
          <button type="button" data-lang="tr" class="active">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn mic-btn" id="rakipMicBtn" type="button" title="Sesli not (Chrome)" aria-label="Sesli not">
          <span class="mic-icon" aria-hidden="true">🎤</span>
          <span class="mic-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
      </div>
      <p class="muted" id="rakipMicHint"></p>
      <button class="btn-primary" id="rakipEkleBtn" type="button">Rakip Ekle</button>
      <div class="status" id="rakipEkleStatus"></div>
    </div>

    <div class="field" id="rakipListeField">
      <h3>Kayıtlı Rakipler</h3>
      <p class="muted" id="rakipListeBos">Henüz kaydedilmiş rakip yok.</p>
      <div class="rakip-table" id="rakipListe"></div>
      <div class="actions" id="rakipListeToggleWrap"></div>
      <div class="actions">
        <button class="btn-secondary hidden" id="rakipSilBtn" type="button" style="background:var(--brand-deep);color:#fff;border-color:var(--brand-deep);">Seçilenleri Sil</button>
      </div>
      <div class="status" id="rakipSilStatus"></div>
    </div>

    <div class="field">
      <h3>Konum ile Rakip Ara</h3>
      <input type="text" id="rakipAdres" placeholder="Adres veya semt (örn: Kadıköy, İstanbul)">
      <input type="text" id="rakipSorgu" placeholder="Ne arıyorsun? (örn: psikolog, terapi merkezi, danışmanlık)">
      <input type="number" id="rakipRadius" placeholder="Yarıçap (metre)" value="2000">
      <label for="rakipMaxSonuc">Kaç sonuç görmek istersin? (Google'ın tek aramada izin verdiği üst sınır: 20 — listeden seç ya da yaz)</label>
      <input type="number" id="rakipMaxSonuc" list="rakipMaxSonucOnerileri" min="1" max="20" value="20">
      <datalist id="rakipMaxSonucOnerileri">
        <option value="3"><option value="5"><option value="10"><option value="15"><option value="20">
      </datalist>
      <button class="btn-secondary" id="rakipAraBtn" type="button">Ara</button>
      <div class="status" id="rakipAraStatus"></div>
      <h3 id="rakipSonuclarBaslik" class="hidden">Arama Sonuçları</h3>
      <div class="rakip-table aksiyon-kolonlu" id="rakipSonuclar"></div>
      <div class="actions" id="rakipSonuclarToggleWrap"></div>
      <div id="rakipHarita" style="height:320px;width:100%;margin-top:0.5rem;"></div>
    </div>

    <div class="field" id="dalIstekField">
      <h3 id="dalBaslik">İstek</h3>
      <div class="row">
        <textarea id="dalIstek" class="grow" placeholder="İsteğinizi yazın ya da mikrofonla dikte edin..."></textarea>
        <div class="mic-lang-toggle" id="dalMicLangToggle">
          <button type="button" data-lang="tr" class="active">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn mic-btn" id="dalMicBtn" type="button" title="Sesli istek (Chrome)" aria-label="Sesli istek">
          <span class="mic-icon" aria-hidden="true">🎤</span>
          <span class="mic-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
      </div>
      <p class="muted" id="dalMicHint"></p>
      <button class="btn-primary" id="dalGonderBtn" type="button">Rapor Üret</button>
      <div class="status" id="dalStatus"></div>
      <div id="dalRapor" class="muted" style="white-space:pre-wrap;"></div>
    </div>
  </section>

</div>

<script src="panel-voice.js?v=1"></script>
<script>
(function () {
  // Local dev (python3 -m http.server + wrangler dev) uses localhost:8787; every other origin
  // (GitHub Pages, custom domain) hits the deployed Worker. Same logic as panel.html.
  var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
    ? 'http://localhost:8787'
    : 'https://form-backend.engintass19-358.workers.dev';

  // Same sessionStorage key as panel.html — if that page's login already ran earlier this
  // browser session, this page opens straight into the app view with no extra login step. If
  // opened fresh (bookmark, header link), it shows its own login screen below — never depends on
  // having visited panel.html first.
  var token = sessionStorage.getItem('panelToken') || '';

  var el = function (id) { return document.getElementById(id); };
  var raLoginView = el('raLoginView'), rakipAnaliziSection = el('rakipAnaliziSection');

  // Kayıtlı Rakipler ve Arama Sonuçları tabloları birebir aynı sütunlara sahip (İsim/Adres/
  // Kaynak/Nasıl Bulundu/Tarih/Not) ve aynı "ilk 3 tam, gerisi silik" sayfalama davranışını
  // paylaşıyor — o yüzden ortak yardımcı fonksiyonlar burada. Kısmi görünürken [Daha Fazla]/
  // [Tümünü Göster], tam açıkken [Daha Az]/[İlk 3'e Dön] — ilan sitesi "daha fazla göster" kalıbı.
  var SAYFALAMA_ADIM = 3;
  var RAKIP_TABLO_BASLIKLARI = ['İsim', 'Adres', 'Kaynak', 'Nasıl Bulundu', 'Tarih', 'Not'];

  function rakipTabloBasligiCiz(listEl, ilkKolonEtiketi) {
    var head = document.createElement('div');
    head.className = 'rakip-row head';
    [ilkKolonEtiketi].concat(RAKIP_TABLO_BASLIKLARI).forEach(function (label) {
      var span = document.createElement('span'); span.textContent = label; head.appendChild(span);
    });
    listEl.appendChild(head);
  }

  function rakipVeriHucreleriEkle(row, veriler) {
    [veriler.isim, veriler.adres, veriler.kaynakEtiket, veriler.nasilBulundu, veriler.tarih, veriler.not].forEach(function (val, colIdx) {
      var span = document.createElement('span');
      if (colIdx === 5) span.className = 'rakip-col-not';
      span.setAttribute('data-label', RAKIP_TABLO_BASLIKLARI[colIdx]);
      span.textContent = val;
      row.appendChild(span);
    });
  }

  function sayfalamaButonlariCiz(wrapEl, state, total, onChange) {
    wrapEl.innerHTML = '';
    if (total <= state.adim) return;
    if (state.visible < total) {
      var dahaFazla = document.createElement('button');
      dahaFazla.type = 'button'; dahaFazla.className = 'btn-secondary';
      dahaFazla.textContent = 'Daha Fazla (+' + Math.min(state.adim, total - state.visible) + ')';
      dahaFazla.addEventListener('click', function () { state.visible = Math.min(total, state.visible + state.adim); onChange(); });
      var tumu = document.createElement('button');
      tumu.type = 'button'; tumu.className = 'btn-secondary';
      tumu.textContent = 'Tümünü Göster (' + total + ')';
      tumu.addEventListener('click', function () { state.visible = total; onChange(); });
      wrapEl.appendChild(dahaFazla); wrapEl.appendChild(tumu);
    } else {
      var dahaAz = document.createElement('button');
      dahaAz.type = 'button'; dahaAz.className = 'btn-secondary';
      dahaAz.textContent = 'Daha Az (-' + state.adim + ')';
      dahaAz.addEventListener('click', function () { state.visible = Math.max(state.adim, state.visible - state.adim); onChange(); });
      var ilkN = document.createElement('button');
      ilkN.type = 'button'; ilkN.className = 'btn-secondary';
      ilkN.textContent = 'İlk ' + state.adim + '’e Dön';
      ilkN.addEventListener('click', function () { state.visible = state.adim; onChange(); });
      wrapEl.appendChild(dahaAz); wrapEl.appendChild(ilkN);
    }
  }

  // Şu ana kadar eklenen (manuel veya haritadan) rakiplerin listesi — bunlar sadece Google
  // Sheet'in RakipAnalizi sekmesinde tutuluyordu, uygulamada görünür bir yer yoktu ("Eklendi"
  // yazıyor ama nereye eklendiği belli değildi).
  var rakipListeCache = [];
  var rakipListeState = { visible: SAYFALAMA_ADIM, adim: SAYFALAMA_ADIM };
  var rakipListeSecili = {}; // id -> true, seçili (silinecek) rakipler

  function updateRakipSilBtn() {
    var count = Object.keys(rakipListeSecili).length;
    var btn = el('rakipSilBtn');
    btn.classList.toggle('hidden', count === 0);
    btn.textContent = 'Seçilenleri Sil (' + count + ')';
  }

  function renderRakipListe() {
    var list = el('rakipListe'), bos = el('rakipListeBos'), toggleWrap = el('rakipListeToggleWrap');
    var rakipler = rakipListeCache;
    list.innerHTML = '';
    bos.classList.toggle('hidden', rakipler.length > 0);
    updateRakipSilBtn();
    if (!rakipler.length) { toggleWrap.innerHTML = ''; return; }

    rakipTabloBasligiCiz(list, '');

    // Görünür N satırın tam altında, SIRADAKİ tek satır kısmen/soluk bir "önizleme" olarak
    // gösteriliyor; onun ötesindekiler hiç render edilmiyor (slice ile DOM'a hiç girmiyor).
    rakipler.slice(0, rakipListeState.visible + 1).forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'rakip-row' + (i === rakipListeState.visible ? ' silik-onizleme' : '');

      var checkboxSpan = document.createElement('span');
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!rakipListeSecili[r.id];
      checkbox.addEventListener('change', function () {
        if (checkbox.checked) { rakipListeSecili[r.id] = true; } else { delete rakipListeSecili[r.id]; }
        updateRakipSilBtn();
      });
      checkboxSpan.appendChild(checkbox);
      row.appendChild(checkboxSpan);

      var tarih = r.createdAtUtc ? new Date(r.createdAtUtc).toLocaleString('tr-TR') : '—';
      var kaynakEtiket = r.kaynak === 'harita' ? 'Haritadan' : 'Manuel';
      var nasilBulundu = '—';
      if (r.kaynak === 'harita' && (r.aramaSorgu || r.aramaAdres)) {
        nasilBulundu = "'" + (r.aramaSorgu || '?') + "' aramasıyla" + (r.aramaRadiusMeters ? ' (' + r.aramaRadiusMeters + 'm)' : '') + (r.aramaAdres ? ' — ' + r.aramaAdres : '');
      }
      rakipVeriHucreleriEkle(row, { isim: r.isim, adres: r.adres || '—', kaynakEtiket: kaynakEtiket, nasilBulundu: nasilBulundu, tarih: tarih, not: r.not || '—' });
      list.appendChild(row);
    });

    sayfalamaButonlariCiz(toggleWrap, rakipListeState, rakipler.length, renderRakipListe);
  }

  el('rakipSilBtn').addEventListener('click', function () {
    var ids = Object.keys(rakipListeSecili);
    if (!ids.length) return;
    var btn = el('rakipSilBtn');
    if (btn.disabled) return;
    btn.disabled = true;
    setStatus(el('rakipSilStatus'), 'Siliniyor...', '');
    authFetch('/panel/rakip-analizi/rakip-sil', { method: 'POST', body: JSON.stringify({ ids: ids }) })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) { setStatus(el('rakipSilStatus'), res.data.error || 'Silinemedi.', 'err'); return; }
        rakipListeSecili = {};
        setStatus(el('rakipSilStatus'), res.data.deleted + ' rakip silindi.', 'ok');
        loadRakipListe();
      })
      .catch(function (e) { if (e.message !== 'unauthorized') setStatus(el('rakipSilStatus'), 'Silinemedi.', 'err'); })
      .finally(function () { btn.disabled = false; });
  });

  function loadRakipListe() {
    authFetch('/panel/rakip-analizi/rakip-liste').then(function (r) { return r.json(); }).then(function (data) {
      rakipListeCache = data.rakipler || [];
      rakipListeState = { visible: SAYFALAMA_ADIM, adim: SAYFALAMA_ADIM };
      rakipListeSecili = {};
      renderRakipListe();
    }).catch(function (e) { if (e.message !== 'unauthorized') { /* sessizce geç, liste yükleme kritik değil */ } });
  }

  // Bu ayki kullanım sayacı — Google aramaları (Adres Bulma/Rakip Arama) sabit bir aylık kotaya
  // karşı, Anthropic çağrıları (Görsel/Video Stratejisi, Aksiyon/Hedef Analizi) ise sınırsız
  // sayılıyor ama bakiye bitince backend zaten 402 döndürüyor (bkz. setStatusLimit). Detaylı
  // olay kaydı (hangi tarihte, hangi aramada) sadece Sheet'in KullanimKaydi sekmesinde.
  function loadKullanimSayaci() {
    authFetch('/panel/rakip-analizi/kullanim-ozet').then(function (r) { return r.json(); }).then(function (data) {
      var container = el('kullanimSayaci');
      container.innerHTML = '';
      var ozet = data.ozet || {};
      Object.keys(ozet).forEach(function (kategori) {
        var k = ozet[kategori];
        var tile = document.createElement('div');
        tile.className = 'kota-tile';
        var baslik = document.createElement('div');
        baslik.className = 'kota-baslik';
        baslik.textContent = k.etiket;
        var deger = document.createElement('div');
        deger.className = 'kota-deger';
        deger.textContent = k.aylikLimit != null ? (k.kullanilan + ' / ' + k.aylikLimit) : (k.kullanilan + ' kullanım');
        tile.appendChild(baslik); tile.appendChild(deger);
        if (k.aylikLimit != null) {
          var bar = document.createElement('div');
          bar.className = 'kota-bar';
          var doluluk = document.createElement('div');
          doluluk.style.width = Math.min(100, (k.kullanilan / k.aylikLimit) * 100) + '%';
          if (k.kullanilan >= k.aylikLimit) doluluk.className = 'dolu';
          bar.appendChild(doluluk);
          tile.appendChild(bar);
        }
        container.appendChild(tile);
      });
    }).catch(function (e) { if (e.message !== 'unauthorized') { /* sessizce geç, sayaç kritik değil */ } });
  }

  // 402 (kota/bakiye doldu) yanıtlarında, düz hata mesajının yanına tıklanabilir bir "hallet"
  // linki eklemek için — backend'in verdiği sabit limitUrl (Anthropic/Google), kullanıcı girdisi
  // değil, o yüzden güvenle link olarak basılabilir.
  function setStatusLimit(elm, msg, url) {
    elm.className = 'status err';
    elm.textContent = '';
    var span = document.createElement('span');
    span.textContent = msg + ' ';
    elm.appendChild(span);
    if (url) {
      var a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Buradan hallet →';
      elm.appendChild(a);
    }
  }

  function showApp() { raLoginView.classList.add('hidden'); rakipAnaliziSection.classList.remove('hidden'); loadRakipListe(); loadKullanimSayaci(); }
  function showLogin() { rakipAnaliziSection.classList.add('hidden'); raLoginView.classList.remove('hidden'); }

  function setStatus(elm, msg, kind) {
    elm.textContent = msg || '';
    elm.className = 'status' + (kind ? ' ' + kind : '');
  }

  // Authenticated fetch — attaches the Bearer token; a 401 (expired/revoked session) sends back
  // to this page's own login screen, same pattern as panel.html's own authFetch.
  function authFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
    return fetch(API_BASE + path, opts).then(function (r) {
      if (r.status === 401) { token = ''; sessionStorage.removeItem('panelToken'); showLogin(); throw new Error('unauthorized'); }
      return r;
    });
  }

  // --- Login (independent of panel.html — same password, same /panel/login endpoint, own screen) ---
  el('raLoginBtn').addEventListener('click', function () {
    var pw = el('raPw').value;
    setStatus(el('raLoginStatus'), '', '');
    fetch(API_BASE + '/panel/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw })
    }).then(function (r) {
      if (!r.ok) throw new Error('bad');
      return r.json();
    }).then(function (data) {
      token = data.token; sessionStorage.setItem('panelToken', token);
      // Same cosmetic flag panel.html sets — reveals both hidden header links ("NOT PANELİ" and
      // "RAKİP ANALİZİ") on every public page, regardless of which of the two tools was used to log in first.
      localStorage.setItem('panelAccess', '1');
      el('raPw').value = ''; showApp();
    }).catch(function () { setStatus(el('raLoginStatus'), 'Parola hatalı.', 'err'); });
  });
  el('raPw').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('raLoginBtn').click(); });

  attachVoiceInput({
    textareaEl: el('rakipNot'),
    micBtnEl: el('rakipMicBtn'),
    micHintEl: el('rakipMicHint'),
    micLangToggleEl: el('rakipMicLangToggle'),
    localStorageKey: 'panelMicLang',
  });
  attachVoiceInput({
    textareaEl: el('dalIstek'),
    micBtnEl: el('dalMicBtn'),
    micHintEl: el('dalMicHint'),
    micLangToggleEl: el('dalMicLangToggle'),
    localStorageKey: 'panelMicLang',
  });

  el('rakipEkleBtn').addEventListener('click', function () {
    var btn = el('rakipEkleBtn');
    var isim = el('rakipIsim').value.trim();
    if (!isim) { setStatus(el('rakipEkleStatus'), 'Rakip ismi gerekli.', 'err'); return; }
    if (btn.disabled) return; // hızlı çift tıklamada aynı rakibi iki kez kaydetmeyi önler
    btn.disabled = true;
    setStatus(el('rakipEkleStatus'), 'Kaydediliyor...', '');
    authFetch('/panel/rakip-analizi/rakip', {
      method: 'POST',
      body: JSON.stringify({ isim: isim, link: el('rakipLink').value.trim(), not: el('rakipNot').value, kaynak: 'manuel' }),
    }).then(function (r) { return r.json(); }).then(function () {
      setStatus(el('rakipEkleStatus'), "'" + isim + "' eklendi — aşağıdaki 'Kayıtlı Rakipler' listesinde görünüyor.", 'ok');
      el('rakipIsim').value = ''; el('rakipLink').value = ''; el('rakipNot').value = '';
      loadRakipListe();
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(el('rakipEkleStatus'), 'Eklenemedi.', 'err'); })
      .finally(function () { btn.disabled = false; });
  });

  // Arama sonuçları, Kayıtlı Rakipler ile birebir aynı sütunlarla + aynı sayfalamayla gösterilir.
  // rakipAramaBaglam, "Ekle"ye basıldığında hangi aramanın sonucu olduğunu (aramaAdres/Sorgu/
  // Radius) kaydetmek ve "Nasıl Bulundu" hücresini doldurmak için son aramanın bağlamını tutar.
  var rakipAramaSonuclariCache = [];
  var rakipAramaState = { visible: SAYFALAMA_ADIM, adim: SAYFALAMA_ADIM };
  var rakipAramaBaglam = null;

  function renderAramaSonuclari() {
    var list = el('rakipSonuclar'), toggleWrap = el('rakipSonuclarToggleWrap');
    var places = rakipAramaSonuclariCache;
    list.innerHTML = '';
    el('rakipSonuclarBaslik').classList.toggle('hidden', places.length === 0);
    if (!places.length) { toggleWrap.innerHTML = ''; return; }

    rakipTabloBasligiCiz(list, '');

    places.slice(0, rakipAramaState.visible + 1).forEach(function (p, i) {
      var row = document.createElement('div');
      row.className = 'rakip-row' + (i === rakipAramaState.visible ? ' silik-onizleme' : '');

      var aksiyonSpan = document.createElement('span');
      var addBtn = document.createElement('button');
      addBtn.type = 'button'; addBtn.className = 'btn-secondary'; addBtn.textContent = 'Ekle';
      addBtn.addEventListener('click', function () {
        if (addBtn.disabled) return; // hızlı çift tıklamada aynı rakibi iki kez kaydetmeyi önler
        addBtn.disabled = true; addBtn.textContent = 'Ekleniyor...';
        authFetch('/panel/rakip-analizi/rakip', {
          method: 'POST',
          body: JSON.stringify({
            isim: p.name, adres: p.address, kaynak: 'harita',
            aramaAdres: rakipAramaBaglam.adres, aramaSorgu: rakipAramaBaglam.sorgu, aramaRadiusMeters: rakipAramaBaglam.radius,
          }),
        }).then(function () { addBtn.textContent = 'Eklendi'; loadRakipListe(); })
          .catch(function (e) { if (e.message !== 'unauthorized') { addBtn.disabled = false; addBtn.textContent = 'Ekle'; } });
      });
      aksiyonSpan.appendChild(addBtn);
      row.appendChild(aksiyonSpan);

      var nasilBulundu = "'" + rakipAramaBaglam.sorgu + "' aramasıyla (" + rakipAramaBaglam.radius + 'm) — ' + rakipAramaBaglam.adres;
      rakipVeriHucreleriEkle(row, { isim: p.name, adres: p.address || '—', kaynakEtiket: 'Haritadan', nasilBulundu: nasilBulundu, tarih: rakipAramaBaglam.zaman, not: '—' });
      list.appendChild(row);
    });

    sayfalamaButonlariCiz(toggleWrap, rakipAramaState, places.length, renderAramaSonuclari);
  }

  el('rakipAraBtn').addEventListener('click', function () {
    var adres = el('rakipAdres').value.trim(), sorgu = el('rakipSorgu').value.trim(), radius = el('rakipRadius').value;
    var maxSonuc = Math.min(20, Math.max(1, Number(el('rakipMaxSonuc').value) || 20));
    if (!adres || !sorgu || !radius) { setStatus(el('rakipAraStatus'), 'Adres, arama terimi ve yarıçap gerekli.', 'err'); return; }
    setStatus(el('rakipAraStatus'), 'Aranıyor...', '');
    var qs = '?adres=' + encodeURIComponent(adres) + '&sorgu=' + encodeURIComponent(sorgu) + '&radiusMeters=' + encodeURIComponent(radius) + '&maxResults=' + maxSonuc;
    authFetch('/panel/rakip-analizi/rakip-ara' + qs).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      loadKullanimSayaci();
      if (!res.ok) { setStatusLimit(el('rakipAraStatus'), res.data.error || 'Arama başarısız.', res.data.limitUrl); return; }
      var places = res.data.places || [];
      rakipAramaBaglam = { adres: adres, sorgu: sorgu, radius: radius, zaman: new Date().toLocaleString('tr-TR') };
      rakipAramaSonuclariCache = places;
      rakipAramaState = { visible: SAYFALAMA_ADIM, adim: SAYFALAMA_ADIM };
      renderAramaSonuclari();
      if (!places.length) { setStatus(el('rakipAraStatus'), 'Bu konum/yarıçapta sonuç bulunamadı.', ''); return; }
      setStatus(el('rakipAraStatus'), places.length + ' sonuç bulundu.', 'ok');
      // Not: Google Maps JS API'nin harita render kısmı (google.maps.Map + Marker) ayrı bir
      // <script src="https://maps.googleapis.com/maps/api/js?key=..."> yüklemesi gerektiriyor —
      // bu adımın kapsamı dışında, ayrı bir küçük takip görevi olarak bırakıldı (liste görünümü
      // haritasız da tam işlevsel).
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(el('rakipAraStatus'), 'Harita şu an yüklenemedi, manuel giriş yapabilirsin.', 'err'); });
  });

  var currentDal = 'icerikStrateji';
  function setDal(dal) {
    currentDal = dal;
    el('dalBaslik').textContent = dal === 'icerikStrateji' ? 'Görsel/Video Stratejisi İsteği' : 'Aksiyon/Hedef Analizi İsteği';
    el('dalIcerikBtn').classList.toggle('active', dal === 'icerikStrateji');
    el('dalAksiyonBtn').classList.toggle('active', dal === 'aksiyonAnaliz');
  }
  el('dalIcerikBtn').addEventListener('click', function () { setDal('icerikStrateji'); });
  el('dalAksiyonBtn').addEventListener('click', function () { setDal('aksiyonAnaliz'); });
  setDal('icerikStrateji');

  el('dalGonderBtn').addEventListener('click', function () {
    var istek = el('dalIstek').value.trim();
    if (!istek) { setStatus(el('dalStatus'), 'İstek metni gerekli.', 'err'); return; }
    setStatus(el('dalStatus'), 'Rapor üretiliyor...', '');
    var path = currentDal === 'icerikStrateji' ? '/panel/rakip-analizi/icerik-strateji' : '/panel/rakip-analizi/aksiyon-analiz';
    var payload = currentDal === 'icerikStrateji' ? { istek: istek } : { yorum: istek };
    authFetch(path, { method: 'POST', body: JSON.stringify(payload) }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      loadKullanimSayaci();
      if (!res.ok) { setStatusLimit(el('dalStatus'), res.data.error || 'Rapor üretilemedi.', res.data.limitUrl); return; }
      setStatus(el('dalStatus'), '', '');
      el('dalRapor').textContent = res.data.rapor;
    }).catch(function (e) { if (e.message !== 'unauthorized') setStatus(el('dalStatus'), 'Rapor şu an üretilemedi, lütfen tekrar dene.', 'err'); });
  });

  // Resume an existing session-token on reload (e.g. already logged in via panel.html).
  if (token) { showApp(); } else { showLogin(); }
})();
</script>
</body>
</html>
